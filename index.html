<style>
/* ===== Design tokens (§11) ===== */
:root{
  --ink:#14181F; --mut:#56606E; --bg:#F4F5F7; --card:#FFFFFF; --line:#E2E5EA;
  --nav:#0E2236; --nav-on:#16304A; --amber-mark:#F2B01E;
  --pri:#1550E6;
  --g-tx:#13734A; --g-bg:#E3F5EC; --g-bar:#22A06B;
  --a-tx:#875A00; --a-bg:#FFF3D4; --a-bar:#F2B01E;
  --r-tx:#B42318; --r-bg:#FDECEA; --od:#7A1010;
  --gray-bg:#EEF0F3;
  --sans:"IBM Plex Sans","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 var(--sans);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--pri);text-decoration:none}
.mono{font-family:var(--mono)}
.app{display:flex;min-height:calc(100vh / var(--z,1))}
/* sidebar */
aside{width:224px;flex:none;background:var(--nav);color:#C5CFDA;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh / var(--z,1))}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 20px}
.brand .mk{width:30px;height:30px;border-radius:7px;background:var(--amber-mark);color:#14181F;font-weight:700;display:grid;place-items:center;font-size:13px}
.brand b{display:block;color:#fff;font-size:15px}.brand small{font-size:9.5px;letter-spacing:.14em;color:#8496A9}
.brand .logo-full{height:46px;width:auto;display:block}.brand .logo-ic{display:none;width:34px;height:34px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 16px;color:#C5CFDA;border-left:3px solid transparent;font-size:13.5px}
nav a:hover{background:#13293F}
nav a.on{background:var(--nav-on);color:#fff;border-left-color:var(--amber-mark)}
nav .ic{width:16px;text-align:center;opacity:.8;font-size:13px}
nav .bd{margin-left:auto;font-family:var(--mono);font-size:11px;border-radius:9px;padding:0 6px;background:#2A4562;color:#fff}
nav .bd.red{background:var(--r-tx)}
.me{margin-top:auto;padding:14px 16px;border-top:1px solid #1D3651;font-size:12px;display:flex;gap:10px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:#2A4562;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
/* top bar */
main{flex:1;min-width:0}
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:10}
.crumb{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{margin-left:auto;width:260px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:#FAFBFC}
.asof{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;white-space:nowrap}
.ex{font-size:10.5px;font-weight:600;letter-spacing:.06em;background:var(--a-bg);color:var(--a-tx);padding:3px 7px;border-radius:5px;white-space:nowrap}
.role{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.bell{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center}
.lang button{padding:6px 10px;font-size:12px;font-weight:600}
.bell i{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--r-tx)}
/* layout */
.page{padding:22px 24px 48px;max-width:none}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:27px;font-weight:600;letter-spacing:-.01em}
.ph p{color:var(--mut);font-size:13px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:500;min-height:36px}
.btn:hover{background:#F7F8FA}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:#0F43C9}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12px}
.g{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.c11{grid-template-columns:repeat(2,minmax(0,1fr))}
.mt{margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:16px;font-weight:600}
.card .sub{color:var(--mut);font-size:12px;margin:2px 0 12px}
.ch{display:flex;align-items:flex-start;gap:10px}.ch .r{margin-left:auto}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-family:var(--mono);font-size:34px;font-weight:500;line-height:1.15;margin:6px 0 2px}
.kpi .n{font-size:12px;color:var(--mut)}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#fff;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.ck{cursor:pointer}tr.ck:hover td{background:#F8F9FB}tr.sel td{background:#EEF3FF}
.num{text-align:right;font-family:var(--mono);white-space:nowrap}
.small{font-size:12px;color:var(--mut)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.nod::before{display:none}
.c-g{background:var(--g-bg);color:var(--g-tx)}.c-a{background:var(--a-bg);color:var(--a-tx)}.c-r{background:var(--r-bg);color:var(--r-tx)}
.c-b{background:#E7EEFF;color:#1440B8}.c-x{background:var(--gray-bg);color:var(--mut)}.c-od{background:var(--od);color:#fff}
.cd{font-family:var(--mono);font-weight:600;border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap}
/* bars */
.bar{position:relative;height:7px;border-radius:9px;background:#E9ECF0;overflow:visible;min-width:70px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--pri)}
.bar>.y{background:var(--a-bar)}.bar>.t{background:var(--g-bar)}
.bar>.pm{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.mini{display:grid;grid-template-columns:auto 1fr 34px;gap:2px 6px;align-items:center;font-size:10.5px;color:var(--mut);min-width:150px}
.mini .bar{height:4px}
/* misc */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{padding:6px 12px;font-size:12.5px;border-right:1px solid var(--line)}.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.list>li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.list .r{margin-left:auto;text-align:right}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 12px;font-size:13px}.kv dt{color:var(--mut)}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--ink);background:#fff}
.f input[readonly]{background:#F4F5F7}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lock{font-size:11px;color:var(--mut)}
.att{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.att .tt{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.att .meta{font-size:12px;color:var(--mut);margin-top:3px}
.banner{display:flex;gap:10px;align-items:center;background:var(--r-bg);color:var(--r-tx);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:12px}
.restricted{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;background:#F7F8FA;border:1px dashed var(--line);border-radius:8px;padding:12px}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13px}
/* stepper */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.steps button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:13px}
.steps button.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.steps .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-family:var(--mono);background:var(--gray-bg)}
.steps .n.ok{background:var(--g-bar);color:#fff}
/* lifecycle */
.life{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.life>div{border:1px solid var(--line);border-radius:10px;padding:12px}
.life .t{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px;margin-bottom:6px}
.life .t span{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px}
.life p{font-size:11.5px;color:var(--mut);margin-bottom:8px;min-height:32px}
/* countdown hero */
.hero{background:var(--nav);color:#fff;border-radius:10px;padding:16px 18px;min-width:330px}
.hero .l{font-size:11px;letter-spacing:.08em;color:#9FB0C2;text-transform:uppercase;display:flex}
.hero .big{font-family:var(--mono);font-size:52px;font-weight:500;line-height:1;margin:8px 0}
.hero .big small{font-family:var(--sans);font-size:14px;color:#9FB0C2;margin-left:6px}
.hero .bar{background:#24405E}
.hero .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:#9FB0C2;margin-top:6px}
/* dependency chain */
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.node{border:1px solid var(--line);border-top:3px solid var(--g-bar);border-radius:8px;padding:8px 10px;min-width:130px;flex:1}
.node.a{border-top-color:var(--a-bar)}.node.r{border-top-color:var(--r-tx)}
.node small{display:block;font-size:10px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.node b{font-size:12.5px;display:block}.node span{font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.arrow{align-self:center;color:var(--mut)}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 16px;overflow-x:auto}
.tabs a{padding:9px 13px;color:var(--mut);font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--pri);font-weight:600}
/* buckets */
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bk{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;background:#fff}
.bk.on{border-color:var(--pri);background:#F3F6FF;box-shadow:0 0 0 1px var(--pri)}
.bk .v{font-family:var(--mono);font-size:20px;font-weight:500;margin:4px 0}
.stat{background:#F7F8FA;border-radius:8px;padding:10px}.stat .v{font-family:var(--mono);font-size:18px}
/* stepper qty */
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:20px}
.qty b{font-family:var(--mono);font-size:22px;min-width:40px;text-align:center}
.qty.sm button{width:32px;height:32px;font-size:16px}.qty.sm b{font-size:16px;min-width:30px}
/* phone */
.phone{width:390px;max-width:100%;margin:0 auto;border:10px solid #10151C;border-radius:36px;overflow:hidden;background:var(--bg);box-shadow:0 20px 50px rgba(0,0,0,.15)}
.phone .hd{background:var(--nav);color:#fff;padding:16px 16px 14px}
.phone .bd{padding:12px;display:flex;flex-direction:column;gap:10px;max-height:560px;overflow:auto}
.phone .ft{position:sticky;bottom:0;padding:12px;background:#fff;border-top:1px solid var(--line)}
.ph-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.photos{display:flex;gap:8px}.photos span{width:72px;height:60px;border-radius:8px;background:#E6E9EE;display:grid;place-items:center;font-size:11px;color:var(--mut)}
.photos span.add{background:#fff;border:1px dashed #B9C0CA}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13px;min-height:36px}
.chk input{width:18px;height:18px;accent-color:var(--g-bar)}

/* compact dashboard + CRM pipeline */
aside{overflow-y:auto}
.pipe{margin:10px 12px 0;padding:10px 0 4px;border-top:1px solid #1D3651}
.pipe .ph2{display:flex;align-items:center;padding:0 4px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8496A9}
.pipe .ph2 a{margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none;color:#C5CFDA;padding:2px 6px;border-radius:6px}
.pipe .ph2 a.on,.pipe .ph2 a:hover{background:var(--nav-on);color:#fff}
.pipe>a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:#C5CFDA;font-size:12.5px}
.pipe>a:hover{background:#13293F}.pipe>a.on{background:var(--nav-on);color:#fff}
.pipe .st{width:8px;height:8px;border-radius:2px;flex:none}
.pipe .c{margin-left:auto;font-family:var(--mono);font-size:11.5px;display:flex;gap:4px;align-items:center}
.pipe .c i{font-style:normal;background:var(--r-tx);color:#fff;border-radius:8px;padding:0 5px;font-size:10px}
.pipe .pf{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:#8496A9;padding:8px 4px 0}
.kstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ks{display:flex;flex-direction:column;padding:12px 14px;border-right:1px solid var(--line);color:inherit;min-width:0}
.ks:last-child{border-right:0}.ks:hover{background:#F8F9FB}
.ks .l{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.ks .v{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.2;margin-top:4px}
.ks .n{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) 110px;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.kp:hover{background:#F8F9FB}
.kp-c{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.kp-m{display:flex;gap:12px;font-size:11.5px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.kp-m b{color:var(--ink);font-weight:500}
.kp-i{font-size:11.5px;color:var(--r-tx);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.rh{display:grid;grid-template-columns:1fr;gap:4px;font-size:12.5px}.rh div{display:flex;gap:10px}.rh .mono{width:44px;color:var(--mut)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:#EBEDF1;border-radius:10px;padding:10px;min-height:300px}
.kcol.on{box-shadow:0 0 0 2px var(--pri)}
.kh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:10px}
.kh .n{width:20px;height:20px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11px;font-family:var(--mono)}
.kh .cnt{margin-left:auto;background:#fff;border-radius:8px;padding:0 7px;font-size:11.5px}
.kc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer}
.kc:hover{border-color:var(--pri)}
@media (max-width:1100px){.kstrip{grid-template-columns:repeat(3,1fr)}.kp{grid-template-columns:1fr}.kp-c{flex-direction:row;align-items:center;justify-content:flex-start}}
@media (max-width:800px){.pipe{display:none}.kstrip{grid-template-columns:repeat(2,1fr)}}

/* board (monday-style) */

</div>

<script id="pcc-data" type="application/json">null</script>
<script>
/* =====================================================================
   McEnergy Project Control Center — clickable prototype (index.html)
   Follows "McEnergy PCC Build Prompt & Functional Spec".
   Data is saved in this browser (localStorage) · Settings → Data to export / import a backup.
   Front-end only: role restrictions here are UI demo; spec requires API enforcement.
   ===================================================================== */

/* ---------- Settings (§7.2, §7.6, §7.7 — configurable) ---------- */
const SET = {
  reportDate: new Date().toISOString().slice(0,10),
  bandGreen: 60, bandAmber: 30,          // >60 green · 31–60 amber · 0–30 red · <0 overdue
  dueSoonDays: 3, gmAfterDays: 3,        // escalation
  rhythm: [["08:30","My Tasks"],["Day","Execution & updates"],["17:00","Engineer daily update due"],["17:30","PM verification"],["18:00","GM review · automatic snapshot"]],
  weights: "Fixed PM-approved weights", uiScale: "auto"
};
const ROLES = {Admin:"Admin",Procurement:"Procurement",Engineer:"Site Engineer",PM:"Project Manager",GM:"General Manager",CEO:"CEO"};
const FIN = ["PM","GM","CEO"];
let ROLE = (()=>{ try{ return localStorage.getItem("pcc-role")||"GM"; }catch(e){ return "GM"; } })();
const canFin = () => FIN.includes(ROLE);

/* ---------- Date helpers (calendar days) ---------- */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dn = s => Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)) / 864e5;
const fd = s => s ? `${s.slice(8,10)} ${MON[+s.slice(5,7)-1]} ${s.slice(0,4)}` : "—";
const fds = s => s ? `${s.slice(8,10)} ${MON[+s.slice(5,7)-1]}` : "—";
const addDays = (s,n) => { const d = new Date((dn(s)+n)*864e5); return d.toISOString().slice(0,10); };
const thb = n => n==null ? "—" : n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const thb0 = n => n.toLocaleString("en-US");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Example data ---------- */
const PROJECTS = [];
const P = id => PROJECTS.find(p=>p.id===id);
const BLANKP = () => ({id:"_new",name:"",scope:"",customer:"",pm:"",eng:"",stage:0,start:SET.reportDate,end:"",eot:0,planned:"",forecast:"",plan:0,act:null,yest:0,doc:0,po:0,del:0,value:null,approved:null,ld:"",stages:["prog","ns","ns","ns","ns"],status:"Wait PO",owner:"",loc:"",order:0,orderDate:"",company:"",contact:"",cpos:"",phone:"",email:"",jobOwner:"",ho:[]});
const emptyPage = (t,m) => `<div class="page"><div class="ph"><div><h1>${t}</h1></div></div><div class="card"><div class="empty">${m}</div></div></div>`;
/* ---------- CRM job status (board, sidebar, pipeline) ---------- */
const CRM = [
  ["Wait PO","#C4C4C4","#323338"],["Cost Approved","#A25DDC","#fff"],["Schedule Plan","#579BFC","#fff"],["Procurement","#FDAB3D","#fff"],
  ["In progress","#0086C0","#fff"],["Report","#9CD326","#1E3A00"],["Commissioning","#FF642E","#fff"],["Done","#00C875","#fff"]];
const crmIdx = s => CRM.findIndex(c=>c[0]===s);
const OWNERS = {};
const ORD=[["Not ordered","c-x"],["Partly ordered","c-a"],["Ordered","c-b"],["Goods received","c-g"]];
const ordChip = p => `<span class="chip nod ${ORD[p.order||0][1]}">${ORD[p.order||0][0]}</span>`;
const fin = v => !canFin() ? "🔒" : v==null||v==="" ? "—" : "฿ "+thb(+v);
const projKV = p => `<dl class="kv"><dt>Contract value</dt><dd class="mono">${fin(p.value)}</dd><dt>Cost Approved</dt><dd class="mono">${fin(p.approved)}</dd>
  <dt>Project manager</dt><dd class="notr">${esc((OWNERS[p.owner]||["",p.owner])[1])}</dd><dt>Job owner</dt><dd class="notr">${esc(p.jobOwner)||"—"}</dd>
  <dt>Ordering</dt><dd>${ordChip(p)}${p.orderDate?` <span class="small mono">${fd(p.orderDate)}</span>`:""}</dd></dl>`;
const custKV = p => `<dl class="kv"><dt>Company</dt><dd class="notr">${esc(p.company)||"—"}</dd><dt>Location</dt><dd class="notr">${esc(p.loc)||"—"}</dd>
  <dt>Contact</dt><dd class="notr">${esc(p.contact)||"—"}${p.cpos?` · ${esc(p.cpos)}`:""}</dd><dt>Phone</dt><dd class="mono">${esc(p.phone)||"—"}</dd><dt>Email</dt><dd class="notr">${esc(p.email)||"—"}</dd></dl>`;
const avatar = (o,sz) => { const a=OWNERS[o]||["#8496A9",o]; const ini=a[1].split(" ").map(w=>w[0]).join("").slice(0,2); return `<span class="av2" title="${esc(a[1])}" style="background:${a[0]};width:${sz||30}px;height:${sz||30}px">${ini}</span>`; };


const DOCS = {};
const STATUS_C = {"Approved":"c-g","Under review":"c-b","Submitted":"c-b","Revise & resubmit":"c-r","Rejected":"c-r","Not submitted":"c-x"};

const BUCKETS = {};
const PK_C = {"Delivered":"c-g","Partially delivered":"c-a","PO issued":"c-b","PR issued":"c-a","Pending":"c-x"};

/* Engineering — Ricoh WBS (weights to be approved, §7.3) */
const WBS = {};
let DAILYS = {};   /* daily updates: {projectId:{date:{date,due,status,today,tomorrow,blocker,tasks:[]}}} */
let DAILY = {date:"",due:"17:00",status:"Draft",today:"",tomorrow:"",blocker:"",tasks:[]};
let USER = (()=>{ try{ return localStorage.getItem("pcc-user")||""; }catch(e){ return ""; } })();
const who = () => (USER||"—")+" ("+ROLE+")";
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ENG = {p:null,d:null};
/* Daily record for a project/date — unfinished quantities carry forward from the last earlier day */
function dailyOf(pid,date){
  const H=DAILYS[pid]||(DAILYS[pid]={}), d=date||RD();
  if(!H[d]){ const prev=Object.keys(H).filter(k=>k<d).sort().pop();
    const tasks=prev?H[prev].tasks.filter(t=>t.planned-t.done>0).map(t=>({id:uid(),name:t.name,wbs:t.wbs,unit:t.unit,planned:+(t.planned-t.done).toFixed(2),done:0})):[];
    H[d]={date:d,due:"17:00",status:"Draft",today:"",tomorrow:"",blocker:"",tasks}; }
  return H[d];
}
/* Who may change what (single-browser use; GM can do everything) */
const CAN={project:["Admin","PM","GM"],doc:["Admin","Engineer","PM","GM"],po:["Procurement","PM","GM"],wbs:["PM","GM"],daily:["Engineer","PM","GM"],task:["Admin","Procurement","Engineer","PM","GM"]};
const can = a => CAN[a].includes(ROLE);
const dis = a => can(a)?"":'disabled title="No permission"';
const projOpts = (none) => (none?[["","—"]]:[]).concat(PROJECTS.map(p=>[p.id,p.name]));
const pname = id => (P(id)||{name:"—"}).name;

const MYTASKS = [];
const EXC = [];
const VERIFY = [["Engineering progress","PM · quantities, site photos"],["Document approval","PM · approval record"],["Equipment delivery","PM · supplier / receiving confirmation"],["Recovery plan","PM proposes · GM reviews"]];
const KICK = ["Kick off meeting completed","Minutes uploaded","Scope confirmed","Team assigned","Master schedule imported","Final cost sheet approved","Document register prepared"];
const KSTATE = {};
const IMPORTS = [];
const REVPREV = [];

/* ---------- Storage (this browser) + export/import ---------- */
const DBKEY="pcc-db-v1";
function dbData(){ const set=Object.assign({},SET); delete set.reportDate; return {app:"McEnergy PCC",v:1,saved:new Date().toISOString(),PROJECTS,OWNERS,DOCS,BUCKETS,WBS,DAILYS,MYTASKS,EXC,SPANS,KSTATE,SET:set}; }
function fillData(dst,src){ if(Array.isArray(dst)) dst.splice(0,dst.length,...(Array.isArray(src)?src:[])); else { Object.keys(dst).forEach(k=>delete dst[k]); Object.assign(dst,src||{}); } }
function loadDB(o){ if(!o||typeof o!=="object") return false;
  fillData(PROJECTS,o.PROJECTS); fillData(OWNERS,o.OWNERS); fillData(DOCS,o.DOCS); fillData(BUCKETS,o.BUCKETS); fillData(WBS,o.WBS);
  fillData(MYTASKS,o.MYTASKS); fillData(EXC,o.EXC); fillData(SPANS,o.SPANS); fillData(KSTATE,o.KSTATE); DAILYS=o.DAILYS||{};
  if(o.SET){ const rd=SET.reportDate; Object.assign(SET,o.SET); SET.reportDate=rd; } return true; }
let SAVE_ERR=false, LAST_SAVE=null;
/* ---------- Data saved inside index.html (File System Access API · Edge / Chrome) ---------- */
const SRC0 = "<!DOCTYPE html>\n"+document.documentElement.outerHTML;   /* pristine page, captured before first render */
let FILE_H=null, FILE_OK=false, FILE_SAVED=null, FILE_DIRTY=false, FILE_BUSY=false;
const DATA_RX=/(<script id="pcc-data" type="application\/json">)[\s\S]*?(<\/script>)/;
function embedJSON(){ return JSON.stringify(dbData()).replace(/</g,"\\u003c"); }
function withData(html){ return DATA_RX.test(html) ? html.replace(DATA_RX,(m,a,b)=>a+embedJSON()+b) : null; }
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("pcc-file",1); r.onupgradeneeded=()=>r.result.createObjectStore("h"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(v){ try{ const d=await idb(); d.transaction("h","readwrite").objectStore("h").put(v,"index"); }catch(e){} }
async function idbGet(){ try{ const d=await idb(); return await new Promise(res=>{ const q=d.transaction("h").objectStore("h").get("index"); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function linkFile(){
  if(!window.showOpenFilePicker){ downloadIndex(); return false; }
  try{ const [h]=await showOpenFilePicker({types:[{description:"PCC index.html",accept:{"text/html":[".html",".htm"]}}],multiple:false});
    const txt=await (await h.getFile()).text();
    if(!DATA_RX.test(txt)||txt.indexOf("McEnergy Project Control Center")<0){ toast("This is not the PCC index.html file"); return false; }
    if(await h.requestPermission({mode:"readwrite"})!=="granted"){ toast("Permission to save was not given"); return false; }
    FILE_H=h; FILE_OK=true; idbSet(h); return true; }catch(e){ return false; } }
async function saveToFile(manual){
  if(FILE_BUSY){ FILE_DIRTY=true; return; }
  if(!FILE_H||!FILE_OK){ if(!manual) return;
    if(FILE_H&&!FILE_OK){ try{ FILE_OK=(await FILE_H.requestPermission({mode:"readwrite"}))==="granted"; }catch(e){} }
    if(!FILE_OK&&!(await linkFile())) { fileBtn(); return; } }
  FILE_BUSY=true; FILE_DIRTY=false;
  try{ const txt=await (await FILE_H.getFile()).text(), out=withData(txt); if(!out) throw new Error("no data block");
    const w=await FILE_H.createWritable(); await w.write(out); await w.close(); FILE_SAVED=new Date(); if(manual) toast("Saved into index.html"); }
  catch(e){ FILE_OK=false; toast("Could not save into index.html — click 💾 to try again"); }
  FILE_BUSY=false; fileBtn(); if(FILE_DIRTY) setTimeout(()=>saveToFile(false),300); }
function downloadIndex(){ const out=withData(SRC0); if(!out){ toast("Could not build the file"); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([out],{type:"text/html"})); a.download="index.html"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("index.html with data downloaded — replace the old file with it"); }
function fileBtn(){ const b=document.getElementById("fileBtn"); if(!b) return;
  b.textContent = FILE_OK ? "💾 "+(FILE_SAVED?(LANG==="th"?"บันทึกลงไฟล์แล้ว ":"Saved to file ")+FILE_SAVED.toLocaleTimeString().slice(0,5):(LANG==="th"?"เชื่อมไฟล์แล้ว":"File linked")) : "💾 "+(LANG==="th"?"บันทึกลง index.html":"Save to index.html");
  b.classList.toggle("pri",!FILE_OK); }
let FILE_T=null; function queueFileSave(){ if(!FILE_OK) return; clearTimeout(FILE_T); FILE_T=setTimeout(()=>saveToFile(false),1200); }
(async()=>{ const h=await idbGet(); if(h){ FILE_H=h; try{ FILE_OK=(await h.queryPermission({mode:"readwrite"}))==="granted"; }catch(e){} } fileBtn(); })();
function saveDB(){ const o=dbData(), cmp=JSON.stringify(Object.assign({},o,{saved:0})); if(cmp===saveDB._last) return; saveDB._last=cmp; const j=JSON.stringify(o); queueFileSave(); try{ localStorage.setItem(DBKEY,j); SAVE_ERR=false; LAST_SAVE=new Date(); }catch(e){ if(!SAVE_ERR){ SAVE_ERR=true; toast("Could not save — browser storage is full or blocked. Export a backup."); } } }
function exportDB(){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(dbData(),null,1)],{type:"application/json"})); a.download="pcc-data-"+RD()+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast("Backup downloaded"); }
function importDB(inp){ const f=inp.files&&inp.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o||!Array.isArray(o.PROJECTS)) throw 0;
    if(!confirm(LANG==="th"?"แทนที่ข้อมูลทั้งหมดในเครื่องนี้ด้วยไฟล์นี้?":"Replace all data in this browser with this file?")) return;
    loadDB(o); saveDB(); render(); toast("Data imported"); }catch(e){ toast("Invalid backup file"); } inp.value=""; };
  r.readAsText(f); }
function clearDB(){ if(!confirm(LANG==="th"?"ลบข้อมูลทั้งหมดในเครื่องนี้? (กู้คืนไม่ได้ ถ้าไม่มีไฟล์สำรอง)":"Delete all data in this browser? (cannot be undone without a backup)")) return;
  loadDB({PROJECTS:[],OWNERS:{},DOCS:{},BUCKETS:{},WBS:{},MYTASKS:[],EXC:[],SPANS:[],KSTATE:{},DAILYS:{}}); saveDB(); render(); toast("All data cleared"); }

/* ---------- Generic form modal ---------- */
let FM=null;
function openForm(o){ FM=o; render(); setTimeout(()=>{ const el=document.querySelector(".mdlc input:not([readonly]),.mdlc select,.mdlc textarea"); if(el) el.focus(); },30); }
function closeForm(){ FM=null; render(); }
function formModal(){ if(!FM) return "";
  const fld=([k,l,t,v,o])=>{ o=o||{}; const id="fm-"+k; let inp;
    if(t==="select") inp=`<select id="${id}" ${o.notr?'class="notr"':""}>${o.opts.map(x=>{const [val,lab]=Array.isArray(x)?x:[x,x];return `<option value="${esc(val)}" ${String(v??"")===String(val)?"selected":""}>${esc(lab)}</option>`}).join("")}</select>`;
    else if(t==="textarea") inp=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
    else inp=`<input id="${id}" type="${t||"text"}" value="${esc(v)}" ${t==="number"?'step="any"':""} ${o.ph?`placeholder="${esc(o.ph)}"`:""}>`;
    return `<label class="f"${o.full||t==="textarea"?' style="grid-column:1/-1"':""}><span>${l}${o.req?' <b style="color:var(--r-tx)">*</b>':""}</span>${inp}</label>`; };
  return `<div class="mdl" onclick="closeForm()"><div class="mdlc" onclick="event.stopPropagation()" role="dialog" aria-label="${esc(FM.title)}">
   <div class="ch" style="margin-bottom:14px"><h3 style="font-size:19px">${esc(FM.title)}</h3><button class="btn sm r" aria-label="Close" onclick="closeForm()">✕</button></div>
   <div class="f2">${FM.fields.map(fld).join("")}</div>
   <div style="display:flex;gap:8px;margin-top:18px">${FM.del?`<button class="btn" style="color:var(--r-tx)" onclick="formDel()">🗑 Delete</button>`:""}<span style="flex:1"></span><button class="btn" onclick="closeForm()">Cancel</button><button class="btn pri" onclick="formSave()">Save</button></div></div></div>`; }
function formVals(){ const r={}; FM.fields.forEach(([k,,t])=>{ const el=document.getElementById("fm-"+k); if(!el) return; let v=el.value.trim(); if(t==="number") v=v===""?null:+v; r[k]=v; }); return r; }
function formSave(){ const v=formVals();
  for(const [k,l,,,o] of FM.fields) if(o&&o.req&&(v[k]===""||v[k]==null)){ toast(trText(l)+(LANG==="th"?" — จำเป็นต้องกรอก":" — required")); return; }
  const err=FM.save(v); if(err){ toast(err); return; } FM=null; render(); toast("Saved"); }
function formDel(){ if(!confirm(LANG==="th"?"ลบรายการนี้?":"Delete this item?")) return; FM.del(); FM=null; render(); toast("Deleted"); }

/* ---------- Calculations (§7) ---------- */
const RD = () => SET.reportDate;
const revisedEnd = p => addDays(p.end, p.eot);
const daysLeft = p => dn(revisedEnd(p)) - dn(RD());
function band(d){
  if(d<0) return {c:"c-od",t:"Overdue",a:"Escalate"};
  if(d<=SET.bandAmber) return {c:"c-r",t:"0–"+SET.bandAmber+" d",a:"Daily monitoring"};
  if(d<=SET.bandGreen) return {c:"c-a",t:(SET.bandAmber+1)+"–"+SET.bandGreen+" d",a:"Review completion plan"};
  return {c:"c-g",t:">"+SET.bandGreen+" d",a:"Normal monitoring"};
}
const cdChip = p => { const d=daysLeft(p), b=band(d); return `<span class="cd ${b.c}">${d} d</span>`; };
function majorPct(m){ return m.subs&&m.subs.length ? m.subs.reduce((s,x)=>s+(+x.w||0)*Math.min(1,x.scope?(+x.cum||0)/x.scope:0),0) : (+m.pct||0); }
function wbsTotal(id){ return (WBS[id]||[]).reduce((s,m)=>s+m.w*majorPct(m)/100,0); }
function actual(p){ return p.act!=null&&p.act!=="" ? +p.act : (WBS[p.id]&&WBS[p.id].length ? +wbsTotal(p.id).toFixed(1) : 0); }
function docPct(p){ const d=DOCS[p.id]; if(!d||!d.length) return p.doc||0; return Math.round(d.filter(x=>x.status==="Approved").length/d.length*100); }
/* PO % = allocated value of packages with a PO no. ÷ total approved bucket budget */
function poPct(p){ const b=BUCKETS[p.id]; if(!b||!b.length) return p.po||0; const bud=b.reduce((s,x)=>s+(+x.budget||0),0); const ord=b.reduce((s,x)=>s+x.pk.filter(k=>k.po).reduce((a,k)=>a+(+k.alloc||0),0),0); return bud?Math.min(100,Math.round(ord/bud*100)):0; }
/* Delivery % = allocated value delivered (partial = half) ÷ total approved bucket budget */
function delPct(p){ const b=BUCKETS[p.id]; if(!b||!b.length) return p.del||0; const bud=b.reduce((s,x)=>s+(+x.budget||0),0); const dv=b.reduce((s,x)=>s+x.pk.reduce((a,k)=>a+(+k.alloc||0)*(k.status==="Delivered"?1:k.status==="Partially delivered"?0.5:0),0),0); return bud?Math.min(100,Math.round(dv/bud*100)):0; }
function health(p){ const v=actual(p)-p.plan; return v>=0 ? {c:"c-g",t:"On track",v} : {c:"c-r",t:"Delayed",v}; }
const fpp = v => (v>0?"+":"")+(+v.toFixed(1))+" pp";
function contractCalc(p){
  const re=revisedEnd(p), dur=Math.max(1,dn(re)-dn(p.start)), el=Math.max(0,dn(RD())-dn(p.start));
  return {re,dur,el,used:el/dur*100,left:dn(re)-dn(RD()),delay:dn(p.forecast)-dn(re)};
}
function escLevel(e){ const d=dn(RD())-dn(e.due);
  if(d>SET.gmAfterDays) return {t:"Owner + PM + GM",c:"c-od"}; if(d>0) return {t:"Owner + PM",c:"c-r"};
  if(-d<=SET.dueSoonDays) return {t:"Owner",c:"c-a"}; return {t:"—",c:"c-x"}; }
const openExc = () => EXC.filter(e=>e.status!=="Closed");

/* ---------- UI helpers ---------- */
const chip = (t,c,nod) => `<span class="chip ${c}${nod?" nod":""}">${esc(t)}</span>`;
const bar = (p,cls,mark) => `<div class="bar"><i class="${cls||""}" style="width:${Math.max(0,Math.min(100,p))}%"></i>${mark!=null?`<span class="pm" style="left:calc(${Math.min(100,mark)}% - 1px)" title="Plan ${mark}%"></span>`:""}</div>`;
const kpi = (l,v,n,col) => `<div class="card kpi"><div class="l">${l}</div><div class="v"${col?` style="color:${col}"`:""}>${v}</div><div class="n">${n||"&nbsp;"}</div></div>`;
const restricted = what => `<div class="restricted">🔒 ${what} — visible to PM, GM, CEO only</div>`;
function toast(m){ const t=document.getElementById("toast"); t.textContent=trText(m); t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }

/* ---------- Navigation ---------- */
const NAV = [["dashboard","Dashboard","▦"],["tasks","My Tasks","☑"],["projects","Projects","▢"],["documents","Documents","🗎"],["procurement","Procurement","🛒"],["engineering","Engineering","⚒"],["actions","Action Center","⚠"],["cost","Cost Control","฿"],["reports","Reports","▤"],["settings","Settings","⚙"]];
function renderPipe(cur){
  const sel=(location.hash.split("/")[1]);
  document.getElementById("pipe").innerHTML=`<div class="ph2"><span>CRM status</span><a href="#pipeline" class="${cur==="pipeline"&&sel==null?"on":""}">All ${PROJECTS.length}</a></div>`+
   CRM.map((c,i)=>{const n=PROJECTS.filter(p=>p.status===c[0]);const d=n.filter(p=>p.status!=="Done"&&health(p).t==="Delayed").length;
    return `<a href="#pipeline/${i}" class="${cur==="pipeline"&&sel===String(i)?"on":""}"><span class="st" style="background:${c[1]}"></span><span class="notr">${c[0]}</span><span class="c">${d?`<i>${d}</i>`:""}${n.length}</span></a>`}).join("")+
   `<div class="pf"><span>${PROJECTS.filter(p=>p.status!=="Done"&&health(p).t==="Delayed").length} delayed</span><span>${openExc().length} open exceptions</span></div>`;
}
function renderNav(cur){

function calEvents(){
  const ev=[]; const add=(d,t,p,kind,note)=>{ if(d) ev.push({d,t,p,kind,note:note||""}); };
  PROJECTS.forEach(p=>{ add(p.start,p.name,p,"start",p.scope); add(revisedEnd(p),p.name,p,"end","Revised contract end"); });
  Object.keys(DOCS).forEach(k=>DOCS[k].forEach(d=>{ if(d.status!=="Approved") add(d.appDue,d.title,P(k),"doc",d.no+" · "+d.status); }));

  EXC.filter(e=>e.status!=="Closed").forEach(e=>add(e.due,e.title,P(e.p),"exc",e.owner));
  MYTASKS.filter(t=>!t.done).forEach(t=>add(t.due,t.t,P(t.pid)||PROJECTS.find(p=>p.name===t.p),"task",t.src));
  return ev.filter(e=>CAL.types[e.kind]&&(CAL.proj==="All"||(e.p&&e.p.id===CAL.proj)));

const safeUrl = u => /^(https?:|mailto:|file:|\\\\)/i.test(u) ? u : "https://"+u;
const fd0 = s => s||"";
function docForm(pid,id){
  const L=DOCS[pid]||(DOCS[pid]=[]), d=L.find(x=>x.id===id)||{no:"",title:"",type:"Material",rev:"A",owner:"",subDue:"",actSub:"",appDue:"",actApp:"",status:"Not submitted",task:"",link:"",appBy:"",appLink:"",hist:[]};
  openForm({title:id?"Edit document":"Add document",fields:[
    ["no","Doc no.","text",d.no,{req:1}],["title","Document","text",d.title,{req:1}],
    ["type","Type","select",d.type,{opts:["Material","Shop drawing","Method statement","Calculation","Other"]}],["rev","Rev","text",d.rev],
    ["owner","Technical owner","text",d.owner],["status","Status","select",d.status,{opts:Object.keys(STATUS_C)}],
    ["subDue","Submission due","date",d.subDue],["actSub","Actual submission","date",d.actSub],
    ["appDue","Approval due","date",d.appDue,{req:1}],["actApp","Actual approval","date",d.actApp],
    ["task","Linked task","text",d.task],["link","File link (SharePoint / Drive URL)","url",d.link,{full:1,ph:"https://…"}],
    ["appBy","Approved by (blank = you)","text",d.appBy,{full:1}],["appLink","Approval evidence link (optional)","url",d.appLink,{full:1,ph:"https://… (signed transmittal / approval email)"}]],
   save:v=>{ if(L.some(x=>x.no===v.no&&x.id!==id)) return "Doc no. already exists";
     if(v.status==="Approved"&&d.status!=="Approved"&&!APPROVERS.includes(ROLE)) return "Only Admin, PM or GM can mark a document Approved";
     if(v.status==="Approved"&&!v.appBy) v.appBy=USER||ROLE;
     if(v.status!=="Approved"){ v.appBy=d.status==="Approved"?"":v.appBy; }
     if(v.status==="Approved"&&!v.actApp) v.actApp=RD(); if(["Submitted","Under review"].includes(v.status)&&!v.actSub) v.actSub=RD();
     if(!id){ const n=Object.assign({id:uid(),hist:[]},v); n.hist.push([(v.status==="Not submitted"?"Registered":v.status)+" · rev. "+v.rev+(v.status==="Approved"?" · by "+v.appBy:""),RD(),who()]); L.push(n); DS.p=pid; DS.sel=n.id; }
     else { if(d.status!==v.status) d.hist.push([v.status+" · rev. "+v.rev+(v.status==="Approved"?" · by "+v.appBy:""),RD(),who()]); Object.assign(d,v); } },
   del:id?()=>{ L.splice(L.indexOf(d),1); DS.sel=null; }:null}); }
const APPROVERS=["Admin","PM","GM"];
function quickApprove(pid,id){ const d=(DOCS[pid]||[]).find(x=>x.id===id); if(!d) return;
  if(!APPROVERS.includes(ROLE)){ toast("Only Admin, PM or GM can mark a document Approved"); return; }
  if(!confirm((LANG==="th"?"อนุมัติ ":"Approve ")+d.no+" · "+d.title+" (rev. "+d.rev+")?")) return;
  Object.assign(d,{status:"Approved",actApp:RD(),appBy:USER||ROLE}); d.hist=d.hist||[]; d.hist.push(["Approved · rev. "+d.rev+" · by "+d.appBy,RD(),who()]);
  DS.sel=d.id; render(); toast("Approved"); }
function quickReturn(pid,id){ const d=(DOCS[pid]||[]).find(x=>x.id===id); if(!d) return;
  if(!APPROVERS.includes(ROLE)){ toast("No permission"); return; }
  const why=prompt(LANG==="th"?"เหตุผลที่ส่งกลับแก้ไข":"Reason for returning (revise & resubmit)",""); if(why===null) return;
  d.status="Revise & resubmit"; d.hist=d.hist||[]; d.hist.push(["Revise & resubmit · rev. "+d.rev+(why?" · "+why:""),RD(),who()]);
  DS.sel=d.id; render(); toast("Returned for revision"); }
function newRev(pid,id){ const d=(DOCS[pid]||[]).find(x=>x.id===id); if(!d) return;
  const r=d.rev||"A", nr=/^[A-Y]$/i.test(r)?String.fromCharCode(r.charCodeAt(0)+1):/^\d+$/.test(r)?String(+r+1):r+"+";
  if(!confirm((LANG==="th"?"ส่ง rev. ":"Submit rev. ")+nr+"?")) return;
  Object.assign(d,{rev:nr,status:"Submitted",actSub:RD(),actApp:"",appBy:"",appLink:""}); d.hist=d.hist||[]; d.hist.push(["Submitted · rev. "+nr,RD(),who()]); render(); toast("Saved"); }

/* ======================= S9 — Reports & cost control ======================= */
function costCard(p){
  if(!canFin()) return `<div class="card"><h3>Cost control</h3><div class="sub">Estimate from approved cost sheet</div>${restricted("Contract value, cost and margin")}</div>`;
  if(!p.approved) return `<div class="card"><h3>Cost control · ${esc(p.name)}</h3><div class="empty">Contract value / Cost Approved not entered yet</div></div>`;
  const gp=(+p.value||0)-p.approved, commit=(BUCKETS[p.id]||[]).reduce((s,b)=>s+b.pk.reduce((a,k)=>a+(k.poValue||0),0),0);
  return `<div class="card"><div class="ch"><div><h3>Cost control · ${esc(p.name)}</h3><div class="sub">Estimate from approved cost sheet — not realized profit ${p.supplied?"· <b>supplied data</b>":""}</div></div><span class="r small">🔒 PM · GM · CEO only</span></div>
   <div class="g k3"><div class="card kpi"><div class="l">Contract value</div><div class="v">${((+p.value||0)/1e6).toFixed(2)}<span style="font-size:16px"> M</span></div><div class="n mono">THB ${thb(+p.value||0)}</div></div>
    <div class="card kpi"><div class="l">Approved cost</div><div class="v">${(p.approved/1e6).toFixed(2)}<span style="font-size:16px"> M</span></div><div class="n mono">THB ${thb(p.approved)}</div></div>
    <div class="card kpi"><div class="l">Gross margin (est.)</div><div class="v" style="color:var(--g-tx)">${p.value?(gp/p.value*100).toFixed(2):"0.00"}%</div><div class="n mono">Est. GP THB ${thb(gp)}</div></div></div>
   <table style="margin-top:12px"><tbody>${[["Approved budget",thb(p.approved)],["Actual PO commitment",commit?thb(commit)+" <span class='small'>(Σ actual PO values)</span>":"[from actual PO values]"],["Actual cost","[from accounting]"],["Estimated cost to complete","[PM estimate]"],["Forecast final cost","[actual + ETC]"],["Forecast margin","[calculated]"],["Budget variance","[approved − forecast]"]].map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td></tr>`).join("")}</tbody></table></div>`;
}

   ${rows.map(([p,a,inc])=>`<tr><td><b>${esc(p.name)}</b></td><td>${cdChip(p)}</td><td class="num">${p.yest}%</td><td class="num">${Math.round(a)}%</td><td class="num" style="color:var(--g-tx)">${inc>=0?"+":""}${Math.round(inc)} pp</td>

/* ---------- Export helper (CSV opens in Excel) ---------- */
function exportCSV(name,rows){
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function trText(s){
  if(LANG!=="th") return s;
  const t=s.trim(); if(!t) return s;
  if(TH[t]) return s.replace(t,TH[t]);
  for(const [rx,rep] of TH_RX){ if(rx.test(t)) return s.replace(t,t.replace(rx,rep)); }
  return s;
}
function translate(root){
  if(LANG!=="th") return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ if(n.parentNode&&(/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)||n.parentNode.closest(".notr"))) continue; const v=trText(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v; }
  root.querySelectorAll("[placeholder]").forEach(el=>{ const p=el.getAttribute("placeholder"); if(TH_PH[p]) el.setAttribute("placeholder",TH_PH[p]); });
}
function setLang(l){
  LANG=l; try{ localStorage.setItem("pcc-lang",l); }catch(e){}
  render();
}
function renderShell(){
  document.querySelector(".ex").textContent="EXAMPLE DATA";
  document.getElementById("roleName").textContent=ROLES[ROLE];
  document.getElementById("userName").textContent=USER||"[User name]";
  document.getElementById("search").setAttribute("placeholder","Search project, document, PO…");
  roleSel.innerHTML=Object.keys(ROLES).map(r=>`<option value="${r}" ${r===ROLE?"selected":""}>View as: ${r}</option>`).join("");
  document.getElementById("lang-en").classList.toggle("on",LANG==="en");
  document.getElementById("lang-th").classList.toggle("on",LANG==="th");
  document.documentElement.lang=LANG;
}


/* ---------- UI scale: follows the screen size (or a fixed size from Settings) ---------- */
try { const u=localStorage.getItem("pcc-scale"); if(u) SET.uiScale=u; } catch(e) {}
function autoScale(){ const w=window.innerWidth; return w>=2400?1.3:w>=2000?1.18:w>=1700?1.08:w>=1280?1:w>=1000?0.92:1; }
function applyScale(){ const z=SET.uiScale==="auto"?autoScale():+SET.uiScale; document.documentElement.style.setProperty("--z",z); document.querySelector(".app").style.zoom=z; }
addEventListener("resize",()=>{ clearTimeout(window._rz); window._rz=setTimeout(applyScale,120); });
/* ---------- Router ---------- */
function render(){
  const parts=(location.hash.slice(1)||"dashboard").split("/"), r=parts[0];
  const map={dashboard:vDashboard,tasks:()=>vActions(true),projects:vProjects,documents:vDocuments,procurement:vProcurement,engineering:vEngineering,site:vSite,actions:()=>vActions(false),cost:()=>vReports(true),reports:()=>vReports(false),settings:vSettings};
  let html, navKey=r;
  if(r==="project"){ html=vProject(parts[1],parts[2]||"overview"); navKey="projects"; }
  else { html=(map[r]||vDashboard)(); if(r==="site") navKey="engineering"; if(r==="pipeline") navKey="pipeline"; if(!map[r]) navKey="dashboard"; }
  document.getElementById("view").innerHTML=html+(EDIT?editModal(EDIT==="_new"?(NEWP||(NEWP=BLANKP())):P(EDIT)||BLANKP()):"")+formModal();
  renderNav(navKey);
  const label=r==="project"&&P(parts[1])?`Projects / ${P(parts[1]).name} / ${(PTABS.find(t=>t[0]===(parts[2]||"overview"))||["",""])[1]}`:(navKey==="pipeline"?"CRM"+(parts[1]!=null?" / "+CRM[+parts[1]][0]:""):(NAV.find(n=>n[0]===navKey)||["","Dashboard"])[1]);
  document.getElementById("crumb").textContent=label;
  document.getElementById("asof").innerHTML=`As of <b>${fd(RD())}</b>`;
  renderShell();
  translate(document.body);
  applyScale();
  saveDB(); fileBtn();
}

/* global search */
document.getElementById("search").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return; const q=e.target.value.trim().toLowerCase(); if(!q) return;
  const p=PROJECTS.find(x=>x.name.toLowerCase().includes(q)); if(p) return go("project/"+p.id+"/overview");
  for(const k in DOCS){ const d=DOCS[k].find(x=>(x.no+" "+x.title).toLowerCase().includes(q)); if(d){ DS.p=k; DS.sel=d.id; return go("documents"); } }
  for(const k in BUCKETS) for(const b of BUCKETS[k]){ const x=b.pk.find(x=>(x.item+" "+(x.po||"")+" "+(x.pr||"")).toLowerCase().includes(q)); if(x){ PS.p=k; PS.b=b.id; PS.k=x.id; return go("procurement"); } }
  toast("No match for “"+q+"”");
});

  if(pick) loadDB(pick); if(pick&&pick===emb&&loc!==null) setTimeout(()=>toast("Loaded newer data saved in index.html"),400); })();
